[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moveinsync-ota"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moveinsync_ota = ["app/templates/*.html", "app/static/*.css", "app/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real CSV files at DATA_DIR (deselect with -m 'not integration')",
]
